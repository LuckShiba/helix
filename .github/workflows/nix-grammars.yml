name: |
  Update Nix grammar lock file
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - languages.toml

permissions:
  contents: write

jobs:
  update-nix-grammars:
    name: Update Nix Grammars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
    
      - name: Install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Update Nix tree-sitter grammars
        run: |
          nix-shell --command "cargo xtask update-nix-grammar-sources"

      - name: Update Nix tree-sitter grammars
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          disable_globbing: true
          commit_message: |
            [Automated] Nix grammar lockfile update
          file_pattern: |
            nix/grammar-sources.json


